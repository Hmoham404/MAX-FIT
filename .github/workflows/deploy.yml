name: Deploy MAX FIT (Cloudflare)

# Requires repository secret CLOUDFLARE_API_TOKEN (Workers Scripts + D1 edit).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_CLOUDFLARE == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: API — D1 migrations + Worker
        working-directory: apps/api
        run: |
          npx wrangler d1 migrations apply maxfit-db --remote
          npx wrangler deploy
      - name: Website — build + deploy
        working-directory: apps/web
        env:
          BASE_PATH: /
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://maxfit-api.foot-arena-pro.workers.dev' }}
        run: npm run deploy
